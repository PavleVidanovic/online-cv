experiences:
    title: Experiences
    info:
      - role: Data Scientist / AI Engineer
        time: Jan 2023 - Present
        company: Wiser Technology (formerly Prime Holding JSC), Sofia, Bulgaria
        details: |
         Member of cross-functional AI engineering teams delivering production-grade machine learning and generative AI solutions. 
         Designed and developed LLM-powered applications, document intelligence pipelines, multi-agent systems, and backend services using Python.
         Worked with OCR, vector databases, RAG, agentic frameworks, and cloud platforms to automate business processes and improve enterprise workflows.
         Developed enterprise AI solutions focused on LLM applications, document processing, and agentic systems for clients in the automotive and financial sectors. 
         Designed scalable backend services and evaluation pipelines while researching emerging LLM and multi-agent architectures.

          - Designed and implemented RAG pipelines and tenant-aware document retrieval systems using LangChain, vector databases (Milvus), and similarity search
          - Built multi-agent systems and production-ready agentic workflows using Microsoft AutoGen, GraphFlow, SelectorGroupChat, and tool-enabled agents
          - Developed backend APIs and data processing services using Python, FastAPI, Flask, and streaming communication for real-time interaction
          - Built AI-powered document intelligence, processing, and procurement pipelines utilizing Azure Document Intelligence, OCR technologies, and LLMs/VLMs
          - Designed and implemented invoice extraction, matching, validation, and document classification pipelines combining OCR, VLMs, and LLMs
          - Implemented structured outputs, validators, evaluation frameworks (LLM-as-a-Judge), and automated testing across projects
          - Researched agentic architectures, document chunking techniques, prompt engineering, retrieval optimization, and LLM evaluation methodologies
          - Worked with cloud infrastructure including Azure, AWS (SQS, Secrets Manager), Docker, MongoDB, and Supabase
          - Collaborated with frontend developers and project managers in Agile teams to deliver production solutions

